[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingview-anywidget"
version = "0.1.0"
description = "A TradingView Lightweight Charts widget for marimo notebooks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9.0",
    "traitlets>=5.0.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5.0"]
polars = ["polars>=0.20.0"]
ta = ["pandas-ta>=0.3.14b", "pandas>=1.5.0"]
dev = [
    "marimo>=0.25.1",
    "pandas>=1.5.0",
    "polars>=0.20.0",
    "yfinance>=0.2.0",
    "pandas-ta>=0.3.14b",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradingview_anywidget"]
